spring.application.name=personal-cloud-file-server
server.servlet.context-path=/rest/cloudfileserver
server.address=0.0.0.0
server.port=8080

file.storage.path=storage
spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB

# Prevent request timeout for long uploads
server.tomcat.connection-timeout=600000

management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/admin/actuator


