apiVersion: v1
kind: Pod
metadata:
  name: volume-test-pod
spec:
  restartPolicy: Never
  containers:
    - name: test-container
      image: alpine:latest
      command: ["/bin/sh"]
      args: ["-c", "echo 'Hello from inside K8s' > /data/test-file.txt; sleep 3600"]
      volumeMounts:
        - mountPath: /data
          name: test-volume
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: local-file-claim  # This must match your existing PVC name